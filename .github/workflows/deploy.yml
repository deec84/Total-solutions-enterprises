name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
      image_uri:
        description: Immutable ECR URI (@sha256); required for production promotion
        required: false
        type: string

permissions: {}

concurrency:
  group: deploy-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.environment == 'staging' || inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Validate protected deployment context and inputs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_NETWORK_CONFIGURATION: ${{ vars.ECS_NETWORK_CONFIGURATION }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          REQUESTED_IMAGE: ${{ inputs.image_uri }}
        run: |
          case "$DEPLOY_ENVIRONMENT" in
            staging|production) ;;
            *) echo "Unsupported deployment environment." >&2; exit 1 ;;
          esac

          printf '%s' "$AWS_ACCOUNT_ID" | grep -Eq '^[0-9]{12}$'
          printf '%s' "$AWS_REGION" | grep -Eq '^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$'
          printf '%s' "$AWS_DEPLOY_ROLE_ARN" | grep -Eq \
            "^arn:aws:iam::${AWS_ACCOUNT_ID}:role/[A-Za-z0-9+=,.@_/-]+$"
          printf '%s' "$ECR_REPOSITORY" | grep -Eq \
            "^${AWS_ACCOUNT_ID}\\.dkr\\.ecr\\.${AWS_REGION}\\.amazonaws\\.com/[a-z0-9][a-z0-9._/-]*$"
          printf '%s' "$ECS_CLUSTER" | grep -Eq '^[A-Za-z0-9_-]{1,255}$'
          printf '%s' "$ECS_SERVICE" | grep -Eq '^[A-Za-z0-9_-]{1,255}$'
          printf '%s' "$ECS_NETWORK_CONFIGURATION" | jq -e '
            .awsvpcConfiguration
            | .assignPublicIp == "DISABLED"
              and (.subnets | type == "array" and length > 0)
              and (.securityGroups | type == "array" and length > 0)
          ' >/dev/null
          printf '%s' "$API_BASE_URL" | grep -Eq '^https://[^[:space:]]+$'

          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && [ -z "$REQUESTED_IMAGE" ]; then
            echo "Production requires a staging-approved image_uri pinned by digest." >&2
            exit 1
          fi
          if [ -n "$REQUESTED_IMAGE" ]; then
            case "$REQUESTED_IMAGE" in
              "$ECR_REPOSITORY"@sha256:*) ;;
              *) echo "image_uri must use the configured ECR repository and @sha256 digest." >&2; exit 1 ;;
            esac
            IMAGE_DIGEST=${REQUESTED_IMAGE##*@sha256:}
            test "${#IMAGE_DIGEST}" -eq 64
            printf '%s' "$IMAGE_DIGEST" | grep -Eq '^[0-9a-f]{64}$'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
          role-session-name: ParkShield-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        if: inputs.image_uri == ''
        with:
          mask-password: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: inputs.image_uri == ''
      - name: Build and push immutable ARM64 image
        if: inputs.image_uri == ''
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
          provenance: true
          sbom: true
      - name: Resolve release image digest
        id: release-image
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          REQUESTED_IMAGE: ${{ inputs.image_uri }}
        run: |
          if [ -n "$REQUESTED_IMAGE" ]; then
            RELEASE_IMAGE="$REQUESTED_IMAGE"
          else
            test -n "$BUILT_DIGEST"
            RELEASE_IMAGE="$ECR_REPOSITORY@$BUILT_DIGEST"
          fi
          echo "uri=$RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Deploying immutable image: $RELEASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Capture current task definition for rollback
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text > previous-task-definition.txt
          CURRENT_TASK=$(cat previous-task-definition.txt)
          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK" \
            --query taskDefinition > task-definition.json
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      - uses: aws-actions/amazon-ecs-render-task-definition@6853cfae8c3a7d978fbf68b5a55453395541dfbb # v1.8.5
        id: render
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.release-image.outputs.uri }}
      - name: Register release task definition
        id: register
        run: |
          jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            "$RENDERED" > release-task-definition.json
          RELEASE_TASK=$(aws ecs register-task-definition \
            --cli-input-json file://release-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$RELEASE_TASK" >> "$GITHUB_OUTPUT"
        env:
          RENDERED: ${{ steps.render.outputs.task-definition }}
      - name: Run forward-only database migration
        id: migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$RELEASE_TASK" \
            --launch-type FARGATE \
            --network-configuration "$ECS_NETWORK_CONFIGURATION" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","-c","/app/alembic.ini","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          test "$TASK_ARN" != "None"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`api`].exitCode | [0]' --output text)
          test "$EXIT_CODE" = "0"
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_NETWORK_CONFIGURATION: ${{ vars.ECS_NETWORK_CONFIGURATION }}
          RELEASE_TASK: ${{ steps.register.outputs.arn }}
      - name: Deploy with ECS circuit breaker
        id: deploy
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$RELEASE_TASK" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          curl --fail --retry 10 --retry-delay 6 "$API_BASE_URL/api/v1/health/ready"
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          RELEASE_TASK: ${{ steps.register.outputs.arn }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Roll back service revision on failed rollout
        if: failure() && steps.migration.outcome == 'success'
        run: |
          PREVIOUS_TASK=$(cat previous-task-definition.txt)
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
